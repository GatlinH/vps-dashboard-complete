# Local source-build override for development or emergency rollback.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  schema_init:
    image: vps-dashboard-complete-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

  api:
    image: vps-dashboard-complete-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

  agent_consumer:
    image: vps-dashboard-complete-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'
