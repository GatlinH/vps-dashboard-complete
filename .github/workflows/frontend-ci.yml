name: Frontend CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
    paths:
      - 'frontend-vite/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend-vite/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build:
    name: Frontend Build (path-filtered)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend-vite/package-lock.json

      - name: Install dependencies
        working-directory: frontend-vite
        run: npm ci

      - name: Production dependency audit
        working-directory: frontend-vite
        run: python3 ../scripts/check-npm-audit.py --root . --allowlist npm-audit-allowlist.json --audit-level high

      - name: Check CSS priority ratchet
        working-directory: frontend-vite
        run: npm run check:css-important

      - name: Check source surfaces
        working-directory: frontend-vite
        run: npm run check:source-surfaces

      - name: Build frontend
        working-directory: frontend-vite
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f frontend-dist/index.html
          test -f frontend-dist/admin.html
          test -f frontend-dist/sw.js
          echo "✅ frontend-dist 构建产物完整"

      - name: Upload frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend-dist/
          retention-days: 7
          overwrite: true
