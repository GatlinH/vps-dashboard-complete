name: Frontend CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
    paths:
      - 'frontend-vite/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend-vite/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build:
    name: Frontend Build (path-filtered)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend-vite/package-lock.json

      - name: Install dependencies
        working-directory: frontend-vite
        run: npm ci

      - name: Production dependency audit
        working-directory: frontend-vite
        run: python3 ../scripts/check-npm-audit.py --root . --allowlist npm-audit-allowlist.json --audit-level high

      - name: Check CSS priority ratchet
        working-directory: frontend-vite
        run: npm run check:css-important

      - name: Check source surfaces
        working-directory: frontend-vite
        run: npm run check:source-surfaces

      - name: Build frontend
        working-directory: frontend-vite
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f frontend-dist/index.html
          test -f frontend-dist/admin.html
          test -f frontend-dist/sw.js
          echo "✅ frontend-dist 构建产物完整"

      - name: Verify Cesium precache exclusions
        working-directory: frontend-vite
        run: npm run test:sw-precache-excludes-cesium

      # Source-contract gates. These were authored with the solar work but were
      # never invoked by any workflow, so nothing enforced them on a pull
      # request. Each one below was measured green on a clean checkout after a
      # real `npm ci`, so adding them cannot turn main red on its own. They
      # need no browser and no local socket.
      - name: Verify solar system home contract
        working-directory: frontend-vite
        run: npm run test:solar-system-home

      - name: Verify single renderer home
        working-directory: frontend-vite
        run: npm run test:single-renderer-home

      - name: Verify solar texture manifest
        working-directory: frontend-vite
        run: npm run test:solar-manifest

      - name: Verify Cesium module workers
        working-directory: frontend-vite
        run: npm run test:cesium-module-workers

      - name: Verify account password UI
        working-directory: frontend-vite
        run: npm run test:account-password-ui

      - name: Verify admin CSS structure
        working-directory: frontend-vite
        run: npm run test:admin-css-structure

      # These two npm aliases are `npm run build && node <script>`. The build
      # already ran above, so the scripts are called directly to avoid building
      # the bundle twice. That moves one guarantee out of the script and into
      # this file: the aliases verified whatever they had just built, whereas
      # these steps verify whatever `Build frontend` left in frontend-dist/.
      # They must therefore stay AFTER that step, and nothing between the two
      # may modify frontend-dist/, or they would silently check a stale bundle.
      - name: Verify solar texture precache exclusions
        working-directory: frontend-vite
        run: node scripts/verify-sw-precache-solar.mjs

      - name: Verify vendor chunk budget
        working-directory: frontend-vite
        run: node scripts/verify-vendor-chunk-budget.mjs

      # Advisory-only companion to the Production dependency audit above, which
      # runs --omit=dev and therefore cannot see devDependency advisories at
      # all. That omission is deliberate for a blocking gate - vitest and
      # tinypool never reach a user's browser - but it leaves the build-time
      # attack surface unwatched, and devDependencies execute with this
      # runner's permissions. source-map-js only became visible to the
      # blocking gate because vite-plugin-cesium happens to pull it into the
      # production tree; the identical postcss -> source-map-js path on the dev
      # side was invisible.
      #
      # Starts at --audit-level critical with its own empty allowlist, so it
      # reports the two tinypool RCE advisories rather than a wall of
      # moderates. continue-on-error keeps it a signal, not a blocker: tighten
      # by removing that line once the dev allowlist has converged. The
      # pre-generated JSON is required because the script hardcodes --omit=dev
      # when it shells out to npm itself.
      - name: Dev dependency audit (advisory)
        working-directory: frontend-vite
        continue-on-error: true
        run: |
          npm audit --audit-level=critical --json > /tmp/dev-audit.json || true
          python3 ../scripts/check-npm-audit.py \
            --root . \
            --audit-json /tmp/dev-audit.json \
            --allowlist npm-audit-dev-allowlist.json \
            --audit-level critical

      - name: Upload frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend-dist/
          retention-days: 7
          overwrite: true
